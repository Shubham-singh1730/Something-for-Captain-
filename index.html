<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorry, Captain</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e2a3a;--panel:#143a4f;--ink:#f4efe3;--muted:#a9c3cf;--brass:#f2b84b;--coral:#ff7a6b;--line:#2b5a73;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9f3f6;--panel:#ffffff;--ink:#12303f;--muted:#4b6b7a;--brass:#b8761a;--coral:#d9503f;--line:#b9d3dc}}
:root[data-theme="dark"]{--bg:#0e2a3a;--panel:#143a4f;--ink:#f4efe3;--muted:#a9c3cf;--brass:#f2b84b;--coral:#ff7a6b;--line:#2b5a73}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;display:flex;justify-content:center;padding:20px 16px}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
h1{font-weight:800;font-size:clamp(2.2rem,9vw,3rem);line-height:1.05;margin:8px 0 0}
.hand{font-family:Caveat,"Segoe Print",cursive;font-weight:700}
.sub{color:var(--muted);margin:0;font-size:1.05rem}
.story{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:22px 20px;min-height:250px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.bars{display:flex;gap:6px;margin-bottom:16px}
.bars i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--brass)}
.slide .big{font-size:1.9rem;font-weight:800;line-height:1.15;margin:0 0 10px}
.slide p{margin:0;font-size:1.3rem;color:var(--muted)}
.slide .hand{font-size:1.7rem;color:var(--ink);line-height:1.3}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:800;color:#10202a;background:var(--brass)}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
.ask{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:22px 20px;text-align:center;position:relative;min-height:190px}
.ask h2{margin:0 0 14px;font-size:1.6rem}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#yes{background:var(--coral);color:#fff;font-size:1.1rem}
#no{position:relative}
#win{display:none}
#win .hand{font-size:2rem;line-height:1.25}
.link{display:inline-block;margin-top:14px;color:var(--brass);font-weight:800}
.foot{text-align:center;color:var(--muted);font-size:.9rem;margin:4px 0 12px}
canvas{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <p class="sub hand" style="font-size:1.6rem" id="kicker"></p>
    <h1 id="title"></h1>
  </header>

  <section class="story" aria-live="polite">
    <div>
      <div class="bars" id="bars"></div>
      <div class="slide" id="slide"></div>
    </div>
    <div class="nav">
      <button class="ghost" id="prev">Back</button>
      <button id="next">Next</button>
    </div>
  </section>

  <section class="ask" id="ask">
    <h2 id="q"></h2>
    <div class="row">
      <button id="yes">Yes, I forgive you</button>
      <button class="ghost" id="no">No</button>
    </div>
    <div id="win"></div>
  </section>

  <p class="foot" id="foot"></p>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
// ✏️ EDIT THESE BEFORE YOU SEND IT
var CFG = {
  her: "Captain",
  me: "Your friend",
  slides: [
    {big: "Captain’s Wrapped", text: "A short report on the person who steers every plan. Tap Next."},
    {big: "I was wrong.", text: "I hurt you, and I don’t want to hide behind excuses."},
    {big: "What you did for me", text: "You listened, you showed up, and you made my bad days lighter."},
    {big: "What I’ll do now", text: "Listen first, think before I speak, and keep my promises."},
    {big: "A joke, for your smile", text: "Why did the momo break up with the chutney? Too much heat. I don’t want to be the heat, Captain."},
    {big: "Play this while you read", text: "A song for you. Change it to your favourite one.", link: {href: "https://www.youtube.com/results?search_query=" + encodeURIComponent("Sorry Justin Bieber"), label: "Play: Sorry by Justin Bieber"}},
    {big: "Momo coupon 🥟", text: "Valid for one full plate of momos with extra chutney. On me. No expiry date."},
    {big: "My note to you", note: "I’m really sorry, Captain. You matter to me more than being right. Please give me one more chance to be the friend you deserve."}
  ]
};

var i = 0, S = CFG.slides;
var $ = function(id){return document.getElementById(id)};
$("kicker").textContent = "For " + CFG.her;
$("title").textContent = "I’m sorry, " + CFG.her + ".";
$("q").textContent = "Will you forgive me?";
$("foot").textContent = "Made with a lot of nervous love by " + CFG.me;

function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function render(){
  var s = S[i];
  $("bars").innerHTML = S.map(function(_,k){return '<i class="'+(k<=i?'on':'')+'"></i>'}).join("");
  $("slide").innerHTML = s.note
    ? '<p class="big">'+esc(s.big)+'</p><div class="hand">'+esc(s.note)+'</div>'
    : '<p class="big">'+esc(s.big)+'</p><p>'+esc(s.text)+'</p>'+(s.link ? '<a class="link" target="_blank" rel="noopener" href="'+s.link.href+'">'+esc(s.link.label)+'</a>' : '');
  $("prev").disabled = i === 0;
  $("next").disabled = i === S.length - 1;
}
$("prev").onclick = function(){ if(i>0){i--;render()} };
$("next").onclick = function(){ if(i<S.length-1){i++;render()} };
render();

// The "No" button runs away
var no = $("no");
function dodge(e){
  if(e) e.preventDefault();
  var box = $("ask").getBoundingClientRect();
  var x = (Math.random()-.5) * (box.width - 140);
  var y = (Math.random()-.5) * 90;
  no.style.transition = "transform .2s";
  no.style.transform = "translate("+x+"px,"+y+"px)";
}
no.addEventListener("mouseenter", dodge);
no.addEventListener("touchstart", dodge, {passive:false});
no.addEventListener("click", dodge);

// Yes → hearts
$("yes").onclick = function(){
  document.querySelector("#ask .row").style.display = "none";
  $("q").textContent = "Thank you, " + CFG.her + " 💛";
  var w = $("win"); w.style.display = "block";
  w.innerHTML = '<div class="hand">I promise to do better. Momos are on me! 🥟</div>';
  hearts();
};

function hearts(){
  var c = $("fx"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  var P = [];
  for (var n=0;n<(reduce?20:70);n++) P.push({x:Math.random()*c.width,y:c.height+Math.random()*200,v:1+Math.random()*3,s:14+Math.random()*22,e:["💛","🥟","❤️","🥟","🌸"][n%5]});
  var f = 0;
  (function loop(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(function(p){p.y -= p.v; x.font = p.s+"px serif"; x.fillText(p.e,p.x,p.y)});
    if (++f < 260) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height);
  })();
}
</script>
</body>
</html>

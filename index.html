<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter for Captain</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1730;--panel:#3b2145;--ink:#fbeee8;--muted:#cdb3c9;--gold:#ffc46b;--rose:#ff8fa3;--line:#5a3a66;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff1ee;--panel:#ffffff;--ink:#3a1f3d;--muted:#7d5a7b;--gold:#b86a00;--rose:#d63d62;--line:#f0cfd3}}
:root[data-theme="dark"]{--bg:#2a1730;--panel:#3b2145;--ink:#fbeee8;--muted:#cdb3c9;--gold:#ffc46b;--rose:#ff8fa3;--line:#5a3a66}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;display:flex;justify-content:center;padding:22px 16px}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:20px}
.hand{font-family:Caveat,"Segoe Print",cursive;font-weight:700}
h1{font-size:clamp(2.2rem,9vw,2.9rem);line-height:1.05;margin:0;font-weight:800}
h2{margin:0 0 10px;font-size:1.35rem}
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:22px 20px}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 18px;font-weight:800;color:#2a1730;background:var(--gold)}
button.rose{background:var(--rose);color:#2a1730}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible,a:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.env{text-align:center}
.env .big{font-size:4rem;line-height:1;display:block;margin:6px 0 10px}
#letter{display:none;margin-top:6px}
#letter.open{display:block;animation:rise .6s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.letter p{font-size:1.15rem;line-height:1.5;margin:0 0 12px}
.sign{font-size:1.8rem;color:var(--gold)}
.admire{display:grid;gap:10px}
.admire div{border-left:4px solid var(--rose);padding:6px 0 6px 12px;font-size:1.05rem}
.prom{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:1.05rem}
.prom:last-of-type{border-bottom:0}
.prom button{margin-left:auto;padding:8px 12px;font-size:.9rem;white-space:nowrap}
.prom.done button{background:transparent;color:var(--gold);cursor:default}
.coupon{border:3px dashed var(--gold);border-radius:18px;padding:18px;text-align:center}
.coupon .hand{font-size:1.8rem;color:var(--gold)}
.link{display:inline-block;margin-top:10px;color:var(--gold);font-weight:800}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px}
#reply{text-align:center;font-size:1.3rem;margin-top:14px;display:none}
.foot{text-align:center;font-size:.9rem;margin:0 0 12px}
canvas{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="hand muted" style="font-size:1.6rem" id="kicker"></div>
    <h1 id="title"></h1>
  </header>

  <section class="card env">
    <span class="big" aria-hidden="true">💌</span>
    <p class="muted" style="margin:0 0 14px">I wrote this for you. Read it whenever you’re ready.</p>
    <button class="rose" id="open">Open my letter</button>
    <div id="letter" class="letter" style="text-align:left"></div>
  </section>

  <section class="card">
    <h2>Things I love about you</h2>
    <div class="admire" id="admire"></div>
  </section>

  <section class="card">
    <h2>My promises to you</h2>
    <div id="proms"></div>
  </section>

  <section class="card coupon">
    <div style="font-size:2.4rem" aria-hidden="true">🥟</div>
    <div class="hand">Momo Coupon</div>
    <p style="margin:6px 0 0">One full plate of momos with extra chutney, on me. No expiry date, no conditions.</p>
  </section>

  <section class="card" style="text-align:center">
    <h2>A song for you</h2>
    <p class="muted" style="margin:0">Play it when you feel like it.</p>
    <a class="link" id="song" target="_blank" rel="noopener"></a>
  </section>

  <section class="card" style="text-align:center">
    <h2 id="q"></h2>
    <p class="muted" style="margin:0">No pressure. Both answers are okay.</p>
    <div class="row" id="btns">
      <button class="rose" id="yes">Yes, I forgive you</button>
      <button class="ghost" id="time">I need some time</button>
    </div>
    <div id="reply" class="hand"></div>
    <div id="wa"></div>
  </section>

  <p class="foot muted" id="foot"></p>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
// EDIT THESE BEFORE YOU SEND IT
var CFG = {
  her: "Captain",
  me: "Your friend",
  phone: "",   // optional: your WhatsApp number with country code, like 919876543210
  song: {name: "Sorry", artist: "Justin Bieber"},   // change to her favourite song
  letter: [
    "I’m sorry. I teased you too much, and I didn’t notice when it stopped being fun and started hurting you.",
    "That is my fault, not yours. You should never have to laugh at something that makes you feel small.",
    "You mean a lot to me, and I would much rather make you smile than win a joke.",
    "From now on I will joke with you, never at you. If I ever go too far, just tell me and I will stop right away."
  ],
  admire: [
    "You make people feel welcome, even when you’re tired.",
    "You are strong and kind at the same time, which is rare.",
    "You make ordinary days feel more fun."
  ],
  promises: [
    "I will only tease when you’re laughing too, and stop the moment you’re not.",
    "I will listen first, then talk.",
    "I will say sorry quickly, not late.",
    "I will remember what you tell me matters to you."
  ]
};

var $ = function(id){return document.getElementById(id)};
function el(tag, cls, text){var e=document.createElement(tag); if(cls) e.className=cls; if(text) e.textContent=text; return e}

$("kicker").textContent = "For " + CFG.her;
$("title").textContent = "I’m sorry, " + CFG.her + ".";
$("q").textContent = "Can we be okay again?";
$("foot").textContent = "With love, " + CFG.me;

CFG.letter.forEach(function(t){ $("letter").appendChild(el("p","",t)) });
$("letter").appendChild(el("div","hand sign","— " + CFG.me));
CFG.admire.forEach(function(t){ $("admire").appendChild(el("div","",t)) });

var q = CFG.song.name + " " + CFG.song.artist;
var sa = $("song");
sa.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
sa.textContent = "Play: " + CFG.song.name + " by " + CFG.song.artist;

CFG.promises.forEach(function(t){
  var row = el("div","prom");
  row.appendChild(el("span","",t));
  var b = el("button","ghost","Seal it 🤞");
  b.onclick = function(){ row.classList.add("done"); b.textContent = "Sealed ✓"; b.disabled = true; };
  row.appendChild(b);
  $("proms").appendChild(row);
});

$("open").onclick = function(){
  $("letter").classList.add("open");
  this.style.display = "none";
  $("letter").scrollIntoView({behavior:"smooth", block:"center"});
};

function waLink(msg){
  if(!CFG.phone) return;
  var a = el("a","link","Reply to me on WhatsApp");
  a.target = "_blank"; a.rel = "noopener";
  a.href = "https://wa.me/" + CFG.phone + "?text=" + encodeURIComponent(msg);
  $("wa").innerHTML = ""; $("wa").style.textAlign = "center"; $("wa").appendChild(a);
}

$("yes").onclick = function(){
  $("btns").style.display = "none";
  $("reply").style.display = "block";
  $("reply").textContent = "Thank you, " + CFG.her + ". I’ll make it up to you. Momos are on me! 🥟💛";
  waLink("Okay, I forgive you 💛");
  hearts();
};
$("time").onclick = function(){
  $("btns").style.display = "none";
  $("reply").style.display = "block";
  $("reply").textContent = "Of course. Take all the time you need. I’ll be here, and I’m not going anywhere. 💛";
  waLink("I need a little time, but thank you for saying sorry.");
};

function hearts(){
  var c = $("fx"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  var P = [], E = ["💛","🥟","❤️","🥟","🌸"];
  for (var n=0;n<(reduce?20:70);n++) P.push({x:Math.random()*c.width,y:c.height+Math.random()*200,v:1+Math.random()*3,s:14+Math.random()*22,e:E[n%5]});
  var f = 0;
  (function loop(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(function(p){p.y -= p.v; x.font = p.s+"px serif"; x.fillText(p.e,p.x,p.y)});
    if (++f < 260) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height);
  })();
}
</script>
</body>
</html>
